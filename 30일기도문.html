<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>30일 기도문</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap');
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#FDF6EC;color:#3D2B1F;font-family:'Noto Sans KR',sans-serif;min-height:100vh}

    /* ── SCREENS ── */
    .screen{display:none}
    .screen.active{display:block}

    /* ── HOME ── */
    #home{padding:0 0 60px}
    .home-header{
      background:linear-gradient(135deg,#8B5C3E 0%,#C9956A 100%);
      color:#fff;text-align:center;padding:56px 24px 44px;
    }
    .home-header h1{font-family:'Nanum Myeongjo',serif;font-size:2.2rem;letter-spacing:.1em;margin-bottom:10px}
    .home-header p{font-size:.95rem;opacity:.85;letter-spacing:.04em}
    .home-cards{
      max-width:520px;margin:40px auto 0;padding:0 20px;
      display:grid;grid-template-columns:1fr 1fr;gap:18px
    }
    .theme-card{
      background:#fff;border-radius:20px;padding:32px 20px;text-align:center;
      box-shadow:0 4px 20px rgba(61,43,31,.1);border:2px solid transparent;
      cursor:pointer;transition:all .25s
    }
    .theme-card:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(61,43,31,.16)}
    .theme-card.card-child{border-color:#EDD9C5}
    .theme-card.card-husband{border-color:#C5D9ED}
    .theme-icon{font-size:2.8rem;margin-bottom:14px}
    .theme-card h2{font-family:'Nanum Myeongjo',serif;font-size:1.05rem;margin-bottom:8px}
    .theme-card .sub{font-size:.78rem;color:#9A7A60;margin-bottom:16px}
    .mini-progress-bg{background:#F2E4D4;border-radius:99px;height:6px;overflow:hidden;margin-bottom:6px}
    .mini-progress-fill{height:100%;border-radius:99px;transition:width .4s}
    .card-child .mini-progress-fill{background:linear-gradient(90deg,#D4A57A,#8B5C3E)}
    .card-husband .mini-progress-fill{background:linear-gradient(90deg,#7A9DC9,#3A5A8C)}
    .mini-label{font-size:.72rem;color:#A07850}

    /* ── DETAIL SCREEN ── */
    #child-screen, #husband-screen{padding-bottom:60px}
    .detail-header{
      padding:40px 24px 28px;color:#fff;text-align:center;position:relative;
    }
    .header-child{background:linear-gradient(135deg,#8B5C3E,#C9956A)}
    .header-husband{background:linear-gradient(135deg,#3A5A8C,#7A9DC9)}
    .back-btn{
      position:absolute;top:18px;left:18px;background:rgba(255,255,255,.22);
      border:none;color:#fff;padding:7px 14px;border-radius:99px;
      cursor:pointer;font-size:.82rem;font-family:'Noto Sans KR',sans-serif;
      transition:background .2s
    }
    .back-btn:hover{background:rgba(255,255,255,.35)}
    .detail-header h1{font-family:'Nanum Myeongjo',serif;font-size:1.8rem;letter-spacing:.08em;margin-bottom:6px}
    .detail-header p{font-size:.88rem;opacity:.85}

    .progress-section{max-width:700px;margin:24px auto 0;padding:0 20px}
    .progress-label{display:flex;justify-content:space-between;font-size:.82rem;color:#7A5540;margin-bottom:7px}
    .progress-bar-bg{background:#EDD9C5;border-radius:99px;height:9px;overflow:hidden}
    .progress-bar-fill{height:100%;border-radius:99px;transition:width .5s ease}
    .fill-child{background:linear-gradient(90deg,#C9956A,#8B5C3E)}
    .fill-husband{background:linear-gradient(90deg,#7A9DC9,#3A5A8C)}

    /* ── GRID ── */
    .grid{max-width:700px;margin:20px auto 0;padding:0 20px;display:grid;gap:14px}

    /* ── CARD ── */
    .day-card{
      background:#fff;border-radius:14px;
      box-shadow:0 2px 10px rgba(61,43,31,.07);
      border:1.5px solid #F2E4D4;overflow:hidden;
      transition:box-shadow .2s,opacity .3s
    }
    .day-card:hover{box-shadow:0 5px 20px rgba(61,43,31,.13)}
    .day-card.done{background:#FFFCF8;border-color:#D4A57A;opacity:.82}

    .card-header{
      display:flex;align-items:center;gap:12px;
      padding:16px 18px 13px;cursor:pointer;user-select:none
    }
    .day-num{
      width:40px;height:40px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-family:'Nanum Myeongjo',serif;font-size:1rem;font-weight:700;
      transition:background .3s;color:#5C3317;
    }
    .num-child{background:linear-gradient(135deg,#EDD9C5,#D4A57A)}
    .num-husband{background:linear-gradient(135deg,#C5D9ED,#7A9DC9);color:#1A3A60}
    .day-card.done .num-child{background:linear-gradient(135deg,#C9956A,#8B5C3E);color:#fff}
    .day-card.done .num-husband{background:linear-gradient(135deg,#7A9DC9,#3A5A8C);color:#fff}

    .card-info{flex:1;min-width:0}
    .card-title{
      font-family:'Nanum Myeongjo',serif;font-size:1rem;font-weight:700;
      color:#3D2B1F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
    }
    .card-date{font-size:.72rem;color:#A07850;margin-top:2px}

    .check-btn{
      width:32px;height:32px;border-radius:50%;border:2px solid #D4A57A;
      background:transparent;cursor:pointer;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;transition:all .2s
    }
    .check-btn:hover{border-color:#C9956A;background:#FDF0E4}
    .check-btn svg{opacity:0;transition:opacity .2s}
    .day-card.done .check-btn{background:#C9956A;border-color:#C9956A}
    .day-card.done .check-btn svg{opacity:1}

    .expand-icon{width:18px;height:18px;color:#C9956A;flex-shrink:0;transition:transform .25s}
    .day-card.open .expand-icon{transform:rotate(180deg)}

    /* ── PRAYER BODY ── */
    .card-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
    .day-card.open .card-body{max-height:500px}
    .card-body-inner{padding:14px 18px 18px;border-top:1px solid #F2E4D4}
    .prayer-verse{
      font-size:.78rem;color:#A07850;font-style:italic;
      padding-left:10px;border-left:3px solid #D4A57A;margin-bottom:11px;line-height:1.6
    }
    .prayer-text{font-size:.91rem;line-height:2;color:#4A3728;white-space:pre-line}

    /* ── RESET ── */
    .reset-wrap{text-align:center;padding:24px 0 8px}
    .reset-btn{
      background:transparent;border:1.5px solid #D4A57A;color:#8B5C3E;
      padding:8px 22px;border-radius:99px;cursor:pointer;
      font-size:.82rem;font-family:'Noto Sans KR',sans-serif;transition:all .2s
    }
    .reset-btn:hover{background:#FDE8D8}

    @media(max-width:480px){
      .home-cards{grid-template-columns:1fr}
      .detail-header h1{font-size:1.5rem}
    }
  </style>
</head>
<body>

<!-- ════════════════ HOME ════════════════ -->
<div id="home" class="screen active">
  <div class="home-header">
    <h1>30일 기도문</h1>
    <p>날마다 믿음으로 드리는 기도</p>
    <a href="기도문관리자.html" style="display:inline-block;margin-top:16px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;padding:6px 16px;border-radius:8px;font-size:.78rem;text-decoration:none;letter-spacing:.02em;">✏️ 기도문 편집</a>
  </div>
  <div class="home-cards">
    <div class="theme-card card-child" onclick="goTo('child')">
      <div class="theme-icon">🌱</div>
      <h2>자녀를 위한<br>30일 기도</h2>
      <p class="sub">자녀의 믿음과 성장을 위해</p>
      <div class="mini-progress-bg">
        <div class="mini-progress-fill" id="home-child-fill" style="width:0%"></div>
      </div>
      <div class="mini-label" id="home-child-label">0 / 30</div>
    </div>
    <div class="theme-card card-husband" onclick="goTo('husband')">
      <div class="theme-icon">🕊️</div>
      <h2>남편을 위한<br>30일 기도</h2>
      <p class="sub">남편의 신앙과 가정을 위해</p>
      <div class="mini-progress-bg">
        <div class="mini-progress-fill" id="home-husband-fill" style="width:0%"></div>
      </div>
      <div class="mini-label" id="home-husband-label">0 / 30</div>
    </div>
  </div>
</div>

<!-- ════════════════ CHILD SCREEN ════════════════ -->
<div id="child-screen" class="screen">
  <div class="detail-header header-child">
    <button class="back-btn" onclick="goHome()">← 홈으로</button>
    <h1>자녀를 위한 30일 기도</h1>
    <p>자녀의 믿음과 성장을 위해</p>
  </div>
  <div class="progress-section">
    <div class="progress-label">
      <span>진행률</span>
      <span id="child-progress-text">0 / 30 완료</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill fill-child" id="child-progress-fill" style="width:0%"></div>
    </div>
  </div>
  <div class="grid" id="child-grid">
    <!-- 30 child prayer cards injected by JS -->
  </div>
  <div class="reset-wrap">
    <button class="reset-btn" onclick="resetSection('child')">기도 기록 초기화</button>
  </div>
</div>

<!-- ════════════════ HUSBAND SCREEN ════════════════ -->
<div id="husband-screen" class="screen">
  <div class="detail-header header-husband">
    <button class="back-btn" onclick="goHome()">← 홈으로</button>
    <h1>남편을 위한 30일 기도</h1>
    <p>남편의 신앙과 가정을 위해</p>
  </div>
  <div class="progress-section">
    <div class="progress-label">
      <span>진행률</span>
      <span id="husband-progress-text">0 / 30 완료</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill fill-husband" id="husband-progress-fill" style="width:0%"></div>
    </div>
  </div>
  <div class="grid" id="husband-grid">
    <!-- 30 husband prayer cards injected by JS -->
  </div>
  <div class="reset-wrap">
    <button class="reset-btn" onclick="resetSection('husband')">기도 기록 초기화</button>
  </div>
</div>

<script>
// ════════════════════════════════════════════
//  PRAYER DATA
//  각 항목 수정: title(제목), verse(성경구절), ref(구절 출처), text(기도문)
// ════════════════════════════════════════════
const PRAYERS = {
  child: [
    {
      title: "믿음 안에서 자라나게 하소서",
      verse: "마땅히 행할 길을 아이에게 가르치라 그리하면 늙어도 그것을 떠나지 아니하리라",
      ref: "잠언 22:6",
      text: `사랑하는 하나님 아버지,
오늘도 저의 자녀를 주님의 손에 올려드립니다.
아이의 마음 밭에 믿음의 씨앗이 뿌리 깊이 내리게 하시고,
주님의 말씀을 사랑하며 날마다 자라나게 하여 주옵소서.
세상의 어떤 유혹과 흔들림 앞에서도
주님께 붙들린 삶을 살아가는 자녀가 되게 하여 주옵소서.
예수님의 이름으로 기도합니다. 아멘.`
    },
    {
      title: "건강한 몸과 마음을 주소서",
      verse: "사랑하는 자여 네 영혼이 잘됨같이 네가 범사에 잘되고 강건하기를 내가 간구하노라",
      ref: "요한삼서 1:2",
      text: `아버지 하나님,
제 자녀의 몸과 마음을 주님의 손으로 지켜 주옵소서.
건강한 육체를 허락하시고,
두려움이나 불안 없이 평안한 마음을 갖게 하여 주옵소서.
아이가 날마다 주님 안에서 기쁨을 발견하게 하시고,
어떤 아픔도 주님이 함께하심으로 이겨내게 하여 주옵소서.
예수님의 이름으로 기도합니다. 아멘.`
    },
    {
      title: "선한 친구들을 만나게 하소서",
      verse: "지혜로운 자와 동행하면 지혜를 얻고 미련한 자와 사귀면 해를 받느니라",
      ref: "잠언 13:20",
      text: `하나님,
제 아이 곁에 선하고 좋은 친구들을 붙여 주시길 기도합니다.
서로를 선하게 세워주는 우정을 허락하시고,
함께할 때 더욱 주님께 가까워지는 관계들을 맺게 하여 주옵소서.
혹 잘못된 관계에서는 지혜롭게 벗어나게 하시고,
아이 스스로도 좋은 친구가 되는 사람으로 자라나게 하여 주옵소서.
예수님의 이름으로 기도합니다. 아멘.`
    },
    {
      title: "학업에 지혜를 더하여 주소서",
      verse: "너희 중에 누구든지 지혜가 부족하거든 모든 사람에게 후히 주시고 꾸짖지 아니하시는 하나님께 구하라",
      ref: "야고보서 1:5",
      text: `지혜의 근원이신 하나님,
제 자녀가 배움의 자리에서 주님이 주시는 지혜로 공부하게 하여 주옵소서.
어렵고 힘든 과목도 포기하지 않는 인내를 주시고,
배운 것을 선하게 쓸 줄 아는 아이로 자라나게 하여 주옵소서.
성적보다 인성이, 결과보다 과정이 아름다운 아이가 되게 하시고,
주님께서 예비하신 길을 걸어가게 하여 주옵소서.
예수님의 이름으로 기도합니다. 아멘.`
    },
    {
      title: "감사하는 마음을 허락하소서",
      verse: "범사에 감사하라 이것이 그리스도 예수 안에서 너희를 향하신 하나님의 뜻이니라",
      ref: "데살로니가전서 5:18",
      text: `하나님,
제 자녀가 작은 것에도 감사할 줄 아는 마음을 갖게 하여 주옵소서.
불평보다 감사가, 원망보다 기도가 먼저 나오는 아이가 되게 하시고,
날마다 주님이 주신 은혜를 세어보며 자라나게 하여 주옵소서.
넉넉한 환경에서나 부족한 환경에서나
항상 감사하며 기뻐하는 아이가 되게 하여 주옵소서.
예수님의 이름으로 기도합니다. 아멘.`
    },
    {
      title: "거짓과 타협하지 않게 하소서",
      verse: "내가 주께 범죄하지 아니하려 하여 주의 말씀을 내 마음에 두었나이다",
      ref: "시편 119:11",
      text: `진리의 하나님,
제 자녀가 정직하고 올곧은 아이로 자라나게 하여 주옵소서.
손해가 되더라도 진실을 말하는 용기를 주시고,
세상의 기준이 아닌 주님의 말씀을 기준으로 삼는 아이가 되게 하여 주옵소서.
죄 앞에서 돌아설 줄 알고,
양심의 소리를 듣고 따르는 삶을 살게 하여 주옵소서.
예수님의 이름으로 기도합니다. 아멘.`
    },
    {
      title: "두려움을 이기는 담대함을 주소서",
      verse: "하나님이 우리에게 주신 것은 두려워하는 마음이 아니요 오직 능력과 사랑과 절제하는 마음이니",
      ref: "디모데후서 1:7",
      text: `하나님,
제 자녀가 어떤 두려움도 주님의 이름으로 이겨내게 하여 주옵소서.
새로운 도전 앞에서 물러서지 않는 담대함을 주시고,
실패가 두렵더라도 다시 일어서는 용기를 허락하여 주옵소서.
주님이 함께하신다는 믿음이 아이의 마음에 깊이 뿌리 내리게 하시고,
두려움이 아닌 믿음으로 삶을 걸어가게 하여 주옵소서.
예수님의 이름으로 기도합니다. 아멘.`
    },
    {
      title: "섬기는 마음을 심어 주소서",
      verse: "인자가 온 것은 섬김을 받으려 함이 아니라 도리어 섬기려 하고",
      ref: "마가복음 10:45",
      text: `주님,
제 자녀가 예수님처럼 섬기는 자로 자라나게 하여 주옵소서.
자기보다 남을 낫게 여기는 마음을 허락하시고,
도움이 필요한 사람에게 손을 내미는 아이가 되게 하여 주옵소서.
작은 섬김에서 시작하여 점점 더 큰 사랑으로 세상을 섬기는 사람이 되게 하시고,
섬김 속에서 진정한 기쁨을 발견하게 하여 주옵소서.
예수님의 이름으로 기도합니다. 아멘.`
    },
    {
      title: "말의 덕을 세우는 아이가 되게 하소서",
      verse: "오직 덕을 세우는 데 소용되는 대로 선한 말을 하여 듣는 자들에게 은혜를 끼치게 하라",
      ref: "에베소서 4:29",
      text: `말씀이신 하나님,
제 자녀의 입술을 주님이 다스려 주시길 기도합니다.
상처 주는 말 대신 격려의 말을,
험담 대신 선한 말을 하는 아이가 되게 하여 주옵소서.
함부로 뱉은 말이 얼마나 큰 상처가 되는지 알게 하시고,
말 한마디로 사람을 살리는 능력을 가진 아이로 자라나게 하여 주옵소서.
예수님의 이름으로 기도합니다. 아멘.`
    },
    {
      title: "부모를 공경하게 하소서",
      verse: "네 부모를 공경하라 그리하면 네 하나님 여호와가 네게 준 땅에서 네 생명이 길리라",
      ref: "출애굽기 20:12",
      text: `하나님,

// ════════════════════════════════════════════
//  BUILD CARDS
// ════════════════════════════════════════════
function getActivePrayers(section) {
  try {
    const custom = JSON.parse(localStorage.getItem('prayer30_custom_' + section));
    if (Array.isArray(custom) && custom.length === 30) return custom;
  } catch {}
  return PRAYERS[section];
}

function buildCards(section) {
  const prayers = getActivePrayers(section);
  const grid = document.getElementById(section + '-grid');
  const numClass = section === 'child' ? 'num-child' : 'num-husband';
  grid.innerHTML = prayers.map((p, i) => {
    const day = i + 1;
    return `
    <div class="day-card" data-section="${section}" data-day="${day}">
      <div class="card-header">
        <div class="day-num ${numClass}">${day}</div>
        <div class="card-info">
          <div class="card-title">${p.title}</div>
          <div class="card-date">${day}일차</div>
        </div>
        <button class="check-btn" onclick="toggleDone(event,'${section}',${day})" title="완료 표시">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
            <path d="M2.5 7.5L6 11L12.5 4.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <svg class="expand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
      <div class="card-body">
        <div class="card-body-inner">
          <div class="prayer-verse">${p.ref} — ${p.verse}</div>
          <div class="prayer-text">${p.text}</div>
        </div>
      </div>
    </div>`;
  }).join('');

  // attach expand listeners
  grid.querySelectorAll('.card-header').forEach(h => {
    h.addEventListener('click', () => h.closest('.day-card').classList.toggle('open'));
  });
}

// ════════════════════════════════════════════
//  STORAGE
// ════════════════════════════════════════════
function loadDone(section) {
  try { return JSON.parse(localStorage.getItem('prayer30_' + section)) || []; }
  catch { return []; }
}
function saveDone(section, arr) {
  localStorage.setItem('prayer30_' + section, JSON.stringify(arr));
}

function applyDone(section) {
  const done = loadDone(section);
  done.forEach(day => {
    const card = document.querySelector(`.day-card[data-section="${section}"][data-day="${day}"]`);
    if (card) card.classList.add('done');
  });
  updateProgress(section);
}

function toggleDone(e, section, day) {
  e.stopPropagation();
  const card = document.querySelector(`.day-card[data-section="${section}"][data-day="${day}"]`);
  const done = loadDone(section);
  if (card.classList.contains('done')) {
    card.classList.remove('done');
    const idx = done.indexOf(day);
    if (idx > -1) done.splice(idx, 1);
  } else {
    card.classList.add('done');
    if (!done.includes(day)) done.push(day);
  }
  saveDone(section, done);
  updateProgress(section);
}

function updateProgress(section) {
  const done = loadDone(section).length;
  const total = PRAYERS[section].length;
  const pct = total ? (done / total * 100).toFixed(0) : 0;
  const el = document.getElementById(section + '-progress-text');
  const fill = document.getElementById(section + '-progress-fill');
  if (el) el.textContent = `${done} / ${total} 완료`;
  if (fill) fill.style.width = pct + '%';
  // home mini
  const hFill = document.getElementById('home-' + section + '-fill');
  const hLabel = document.getElementById('home-' + section + '-label');
  if (hFill) hFill.style.width = pct + '%';
  if (hLabel) hLabel.textContent = `${done} / ${total}`;
}

function resetSection(section) {
  if (!confirm('기도 완료 기록을 모두 초기화할까요?')) return;
  localStorage.removeItem('prayer30_' + section);
  document.querySelectorAll(`.day-card[data-section="${section}"]`).forEach(c => c.classList.remove('done'));
  updateProgress(section);
}

// ════════════════════════════════════════════
//  NAVIGATION
// ════════════════════════════════════════════
function goTo(section) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(section + '-screen').classList.add('active');
  window.scrollTo(0, 0);
  history.replaceState(null, '', '#' + section);
  buildCards(section);
  applyDone(section);
}

function goHome() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('home').classList.add('active');
  window.scrollTo(0, 0);
  history.replaceState(null, '', location.pathname);
  updateProgress('child');
  updateProgress('husband');
}

// ════════════════════════════════════════════
//  INIT — URL 해시로 마지막 섹션 복원
// ════════════════════════════════════════════
updateProgress('child');
updateProgress('husband');
const _hash = location.hash.replace('#', '');
if (_hash === 'child' || _hash === 'husband') {
  goTo(_hash);
}
</script>
