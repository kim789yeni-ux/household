<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가계부 - Firebase 실시간 공유</title>
  <style>
    :root {
      --bg: #f6f8fc;
      --card: #ffffff;
      --text: #24324a;
      --muted: #66748a;
      --line: #e5ebf3;
      --accent: #4f77ff;
      --accent2: #4cc4a6;
      --danger: #ec5d5d;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .auth-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(36, 50, 74, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .auth-modal.hidden {
      display: none;
    }

    .auth-form {
      background: white;
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(36, 50, 74, 0.2);
    }

    .auth-form h2 {
      margin: 0 0 20px;
      font-size: 1.4rem;
    }

    .auth-form .field {
      margin-bottom: 12px;
    }

    .auth-form label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.84rem;
      color: var(--muted);
      font-weight: 600;
    }

    .auth-form input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      color: var(--text);
      background: #fbfdff;
      font-family: inherit;
    }

    .hero {
      background: linear-gradient(135deg, #4f77ff 0%, #6f7cff 100%);
      color: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 18px 40px rgba(79, 119, 255, 0.18);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .hero-left h1 {
      margin: 0 0 8px;
      font-size: 1.7rem;
    }

    .hero-left p {
      margin: 0 0 16px;
      color: rgba(255,255,255,0.92);
      font-size: 0.95rem;
    }

    .user-info {
      background: rgba(255,255,255,0.16);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .user-info button {
      background: #ec5d5d;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.8rem;
      margin-top: 8px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .summary-card {
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.24);
      border-radius: 16px;
      padding: 14px;
      backdrop-filter: blur(8px);
    }

    .summary-card .label { font-size: 0.8rem; opacity: 0.92; }
    .summary-card .value { font-size: 1.17rem; font-weight: 700; margin-top: 4px; }

    .grid {
      display: grid;
      grid-template-columns: 1.02fr 0.98fr;
      gap: 16px;
      margin-top: 18px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 10px 24px rgba(36, 50, 74, 0.05);
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 1.05rem;
    }

    .field {
      margin-bottom: 10px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.84rem;
      color: var(--muted);
      font-weight: 600;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      color: var(--text);
      background: #fbfdff;
      font-family: inherit;
    }

    .field textarea { min-height: 78px; resize: vertical; }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 13px;
      font-size: 0.94rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover { transform: translateY(-1px); }

    .btn-primary { background: var(--accent); color: white; }
    .btn-second { background: #eef3ff; color: var(--accent); }
    .btn-danger { background: #ffeaea; color: var(--danger); }
    .btn-success { background: #e6f9f3; color: var(--accent2); }

    .tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .helper-text {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .filter {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .filter .chip {
      border: 1px solid var(--line);
      background: #f9fbff;
      color: var(--muted);
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .item {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: #fcfdff;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .item .meta { flex: 1; min-width: 0; }
    .item .title { font-weight: 700; margin-bottom: 2px; }
    .item .sub { font-size: 0.86rem; color: var(--muted); }

    .badge {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 0.77rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .badge.expense { background: #ffeaea; color: var(--danger); }
    .badge.income { background: #e6f9f3; color: var(--accent2); }

    .amount {
      font-weight: 800;
      font-size: 1rem;
      white-space: nowrap;
    }

    .amount.expense { color: var(--danger); }
    .amount.income { color: var(--accent2); }

    .empty {
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 14px;
      padding: 16px;
      background: #fcfdff;
    }

    .card-summary {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .card-summary-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fcfdff;
    }

    .card-summary-title {
      font-weight: 700;
    }

    .card-summary-amount {
      color: var(--danger);
      font-weight: 700;
      white-space: nowrap;
    }

    .category-summary {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .category-summary-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fdfefe;
    }

    .category-summary-title {
      font-weight: 700;
    }

    .category-summary-amount {
      color: var(--danger);
      font-weight: 700;
      white-space: nowrap;
    }

    .record-group {
      margin-bottom: 12px;
    }

    .record-group-title {
      font-size: 0.92rem;
      font-weight: 800;
      margin: 0 0 8px;
      color: var(--accent);
    }

    .payment-summary {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .payment-summary-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: #f7faff;
    }

    .payment-summary-title {
      font-weight: 700;
    }

    .payment-summary-amount {
      color: var(--danger);
      font-weight: 700;
      white-space: nowrap;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #24324a;
      color: white;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      box-shadow: 0 12px 24px rgba(36, 50, 74, 0.18);
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 1000;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    .share-section {
      background: #e6f9f3;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .share-input {
      display: flex;
      gap: 8px;
      margin: 8px 0;
    }

    .share-input input {
      flex: 1;
    }

    @media (max-width: 830px) {
      .grid { grid-template-columns: 1fr; }
      .summary { grid-template-columns: 1fr; }
      .hero { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="auth-modal" class="auth-modal">
    <div class="auth-form">
      <h2>🏠 가계부 로그인</h2>
      <div class="field">
        <label for="auth-email">이메일</label>
        <input id="auth-email" type="email" placeholder="example@gmail.com" />
      </div>
      <div class="field">
        <label for="auth-password">비밀번호</label>
        <input id="auth-password" type="password" placeholder="영문/숫자 6자 이상" />
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="login-btn">로그인</button>
        <button class="btn-second" id="signup-btn">회원가입</button>
      </div>
      <div class="helper-text" style="text-align:center; margin-top:12px;">
        ✅ Firebase가 정상 연결되었습니다.<br/>계정을 만들고 남편과 함께 사용하세요.
      </div>
    </div>
  </div>

  <div class="wrap">
    <section class="hero">
      <div class="hero-left">
        <h1>🏠 가계부</h1>
        <p>남편과 함께 기록하고, 실시간으로 공유하세요.</p>
        <div class="user-info" id="user-info" style="display:none;">
          <div id="user-name"></div>
          <button id="logout-btn">로그아웃</button>
        </div>
      </div>
      <div class="summary">
        <div class="summary-card">
          <div class="label">이번 달 수입</div>
          <div class="value" id="income-total">0원</div>
        </div>
        <div class="summary-card">
          <div class="label">이번 달 지출</div>
          <div class="value" id="expense-total">0원</div>
        </div>
        <div class="summary-card">
          <div class="label">잔액</div>
          <div class="value" id="balance-total">0원</div>
        </div>
      </div>
    </section>

    <div class="grid">
      <section class="panel">
        <h2>➕ 내역 추가</h2>
        <div class="field">
          <label for="date">날짜</label>
          <input id="date" type="date" />
        </div>
        <div class="row-2">
          <div class="field">
            <label for="type">분류</label>
            <select id="type">
              <option value="expense">지출</option>
              <option value="income">수입</option>
            </select>
          </div>
          <div class="field">
            <label for="category">카테고리</label>
            <select id="category">
              <option value="식비">식비</option>
              <option value="교통">교통</option>
              <option value="생활">생활</option>
              <option value="카페">카페</option>
              <option value="보험료">보험료</option>
              <option value="아이관련">아이관련</option>
              <option value="반려견관련">반려견관련</option>
              <option value="월급">월급</option>
              <option value="기타">기타</option>
            </select>
          </div>
        </div>
        <div class="row-2">
          <div class="field">
            <label for="amount">금액</label>
            <input id="amount" type="number" min="0" step="100" placeholder="예: 12000" />
          </div>
          <div class="field">
            <label for="payment">결제수단</label>
            <select id="payment">
              <option value="현금">현금</option>
              <option value="카드">카드</option>
              <option value="체크카드">체크카드</option>
              <option value="계좌이체">계좌이체</option>
              <option value="기타">기타</option>
            </select>
          </div>
        </div>
        <div class="field" id="card-name-field" style="display:none;">
          <label for="card-name">카드 종류 / 계좌명</label>
          <input id="card-name" list="card-name-list" placeholder="예: 삼성biz, 카뱅예원" />
          <datalist id="card-name-list">
            <option value="삼성biz"></option>
            <option value="삼성edu"></option>
            <option value="삼성u+"></option>
            <option value="현대코스트코"></option>
            <option value="신한성민"></option>
            <option value="삼성성민"></option>
          </datalist>
        </div>
        <div class="helper-text">카드·체크카드·현금계좌를 구분해서 기록하면 정산이 더 편합니다.</div>
        <div class="field">
          <label for="description">내용</label>
          <input id="description" type="text" placeholder="예: 장보기, 월급, 보험료" />
        </div>
        <div class="field">
          <label for="memo">메모</label>
          <textarea id="memo" placeholder="남편과 공유할 메모를 적어요."></textarea>
        </div>
        <div class="btn-row">
          <button class="btn-primary" id="save-btn">저장하기</button>
          <button class="btn-second" id="reset-btn">입력 초기화</button>
        </div>
      </section>

      <section class="panel">
        <div class="filter">
          <h2 style="margin:0;">📝 기록 목록</h2>
          <div class="chip" id="month-label">이번 달</div>
        </div>
        <div class="tools">
          <input id="month-filter" type="month" />
          <div class="chip" id="sync-status">⏳ 로딩 중...</div>
        </div>
        <div class="share-section">
          <div style="font-weight: 700; margin-bottom: 8px;">🔗 남편과 공유하기</div>
          <div class="helper-text">남편의 이메일을 입력하면 실시간으로 가계부를 공유할 수 있습니다.</div>
          <div class="share-input">
            <input id="share-email" type="email" placeholder="남편 이메일을 입력하세요" />
            <button class="btn-success" id="share-btn">공유 요청</button>
          </div>
          <div id="share-list"></div>
        </div>
        <div class="helper-text">카드 정산은 월별 카드 합계로 맞춰보면 편합니다.</div>
        <div id="payment-summary" class="payment-summary"></div>
        <div id="category-summary" class="category-summary"></div>
        <div id="card-summary" class="card-summary"></div>
        <div id="records-list" class="list"></div>
      </section>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDzdnQ1YL9kvioHuoTq__s-e8atE_srYTA",
      authDomain: "household-1d142.firebaseapp.com",
      databaseURL: "https://household-1d142-default-rtdb.firebaseio.com",
      projectId: "household-1d142",
      storageBucket: "household-1d142.firebasestorage.app",
      messagingSenderId: "1036698141261",
      appId: "1:1036698141261:web:9c3266edeb90de53389204",
      measurementId: "G-Q1CWWV1YRV"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    const state = { records: [], currentUser: null, sharedWith: [] };
    const refs = {
      authModal: document.getElementById('auth-modal'),
      authEmail: document.getElementById('auth-email'),
      authPassword: document.getElementById('auth-password'),
      loginBtn: document.getElementById('login-btn'),
      signupBtn: document.getElementById('signup-btn'),
      logoutBtn: document.getElementById('logout-btn'),
      userInfo: document.getElementById('user-info'),
      userName: document.getElementById('user-name'),
      date: document.getElementById('date'),
      type: document.getElementById('type'),
      category: document.getElementById('category'),
      amount: document.getElementById('amount'),
      payment: document.getElementById('payment'),
      cardName: document.getElementById('card-name'),
      cardNameField: document.getElementById('card-name-field'),
      description: document.getElementById('description'),
      memo: document.getElementById('memo'),
      monthFilter: document.getElementById('month-filter'),
      recordsList: document.getElementById('records-list'),
      incomeTotal: document.getElementById('income-total'),
      expenseTotal: document.getElementById('expense-total'),
      balanceTotal: document.getElementById('balance-total'),
      monthLabel: document.getElementById('month-label'),
      paymentSummary: document.getElementById('payment-summary'),
      categorySummary: document.getElementById('category-summary'),
      cardSummary: document.getElementById('card-summary'),
      toast: document.getElementById('toast'),
      syncStatus: document.getElementById('sync-status'),
      shareEmail: document.getElementById('share-email'),
      shareBtn: document.getElementById('share-btn'),
      shareList: document.getElementById('share-list')
    };

    function formatWon(v) { return `${Number(v).toLocaleString()}원`; }
    function showToast(m) { refs.toast.textContent = m; refs.toast.classList.add('show'); clearTimeout(showToast.timer); showToast.timer = setTimeout(() => refs.toast.classList.remove('show'), 1800); }
    function updateSyncStatus(m) { refs.syncStatus.textContent = m; }
    function getCurrentMonth() { const n = new Date(); const y = n.getFullYear(); const m = String(n.getMonth() + 1).padStart(2, '0'); return `${y}-${m}`; }
    function getFilteredRecords() { const m = refs.monthFilter.value || getCurrentMonth(); return state.records.filter(i => i.date.startsWith(m)); }
    function updateCardFieldVisibility() { const s = ['현금', '카드', '체크카드'].includes(refs.payment.value); refs.cardNameField.style.display = s ? 'block' : 'none'; if (!s) refs.cardName.value = ''; }
    function getExpenseTotal(f, matcher) { return f.filter(i => i.type === 'expense' && matcher(i)).reduce((sum, i) => sum + Number(i.amount || 0), 0); }
    function renderPaymentSummary(f) { const g = [{ title: '현금 / 체크카드 지출', matcher: i => ['현금', '체크카드'].includes(i.payment) }, { title: '카드 지출', matcher: i => i.payment === '카드' }, { title: '기타 지출', matcher: i => ['계좌이체', '기타'].includes(i.payment) }]; refs.paymentSummary.innerHTML = g.map(g => `<div class="payment-summary-item"><div class="payment-summary-title">${escapeHtml(g.title)}</div><div class="payment-summary-amount">${formatWon(getExpenseTotal(f, g.matcher))}</div></div>`).join(''); }
    function renderCategorySummary(f) { const t = f.filter(i => i.type === 'expense').reduce((a, i) => { const k = i.category || '기타'; a[k] = (a[k] || 0) + Number(i.amount || 0); return a; }, {}); const e = Object.entries(t).sort((a, b) => b[1] - a[1]); if (!e.length) { refs.categorySummary.innerHTML = '<div class="empty">이번 달 카테고리 지출 내역이 없습니다.</div>'; return; } refs.categorySummary.innerHTML = e.map(([n, a]) => `<div class="category-summary-item"><div class="category-summary-title">${escapeHtml(n)}</div><div class="category-summary-amount">${formatWon(a)}</div></div>`).join(''); }
    function renderCardSummary(f) { const t = f.filter(i => i.type === 'expense' && ['카드', '체크카드'].includes(i.payment) && i.cardName).reduce((a, i) => { const k = i.cardName; a[k] = (a[k] || 0) + Number(i.amount || 0); return a; }, {}); const e = Object.entries(t).sort((a, b) => b[1] - a[1]); if (!e.length) { refs.cardSummary.innerHTML = '<div class="empty">이번 달 카드 지출 내역이 없습니다.</div>'; return; } refs.cardSummary.innerHTML = e.map(([n, a]) => `<div class="card-summary-item"><div class="card-summary-title">${escapeHtml(n)}</div><div class="card-summary-amount">${formatWon(a)}</div></div>`).join(''); }
    function render() { const m = refs.monthFilter.value || getCurrentMonth(); refs.monthLabel.textContent = `${m.replace('-', '년 ')}월`; const f = getFilteredRecords(); const inc = f.filter(i => i.type === 'income').reduce((s, i) => s + Number(i.amount || 0), 0); const exp = f.filter(i => i.type === 'expense').reduce((s, i) => s + Number(i.amount || 0), 0); const bal = inc - exp; refs.incomeTotal.textContent = formatWon(inc); refs.expenseTotal.textContent = formatWon(exp); refs.balanceTotal.textContent = `${bal >= 0 ? '' : '-'}${formatWon(Math.abs(bal))}`; renderPaymentSummary(f); renderCategorySummary(f); renderCardSummary(f); if (!f.length) { refs.recordsList.innerHTML = '<div class="empty">이 달의 기록이 없습니다. 위 폼에서 추가해보세요.</div>'; return; } const g = []; const ei = f.filter(i => i.type === 'expense'); const ci = ei.filter(i => ['현금', '체크카드'].includes(i.payment)); if (ci.length) g.push({ title: '현금 / 체크카드 지출', items: ci }); const cb = ei.filter(i => i.payment === '카드').reduce((a, i) => { const k = i.cardName || '카드(미입력)'; if (!a[k]) a[k] = []; a[k].push(i); return a; }, {}); Object.entries(cb).sort((a, b) => b[1].length - a[1].length).forEach(([n, is]) => g.push({ title: `카드 · ${n}`, items: is })); const oe = ei.filter(i => !['현금', '체크카드', '카드'].includes(i.payment)); if (oe.length) g.push({ title: '기타 지출', items: oe }); const ii = f.filter(i => i.type === 'income'); if (ii.length) g.push({ title: '수입', items: ii }); refs.recordsList.innerHTML = g.map(grp => { const ih = grp.items.sort((a, b) => b.date.localeCompare(a.date)).map(i => { const pl = ['현금', '카드', '체크카드'].includes(i.payment) && i.cardName ? `${escapeHtml(i.payment)} · ${escapeHtml(i.cardName)}` : escapeHtml(i.payment || '기타'); return `<div class="item"><div class="meta"><span class="badge ${i.type === 'income' ? 'income' : 'expense'}">${i.type === 'income' ? '수입' : '지출'}</span><div class="title">${escapeHtml(i.description || '내용 없음')}</div><div class="sub">${i.date} · ${escapeHtml(i.category)} · ${pl}</div>${i.memo ? `<div class="sub">${escapeHtml(i.memo)}</div>` : ''}</div><div style="display:flex; align-items:center; gap:8px;"><div class="amount ${i.type === 'income' ? 'income' : 'expense'}">${i.type === 'income' ? '+' : '-'}${formatWon(i.amount || 0)}</div><button class="btn-danger" onclick="removeRecord('${i.id}')">삭제</button></div></div>`; }).join(''); return `<div class="record-group"><div class="record-group-title">${escapeHtml(grp.title)}</div><div class="list">${ih}</div></div>`; }).join(''); }
    function escapeHtml(v) { return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
    function resetForm() { refs.date.value = new Date().toISOString().slice(0, 10); refs.type.value = 'expense'; refs.category.value = '식비'; refs.amount.value = ''; refs.payment.value = '카드'; refs.cardName.value = ''; refs.description.value = ''; refs.memo.value = ''; updateCardFieldVisibility(); refs.amount.focus(); }
    function addRecord() { if (!state.currentUser) { showToast('로그인해주세요.'); return; } const p = { id: crypto.randomUUID(), date: refs.date.value || new Date().toISOString().slice(0, 10), type: refs.type.value, category: refs.category.value, amount: Number(refs.amount.value || 0), payment: refs.payment.value, cardName: ['현금', '카드', '체크카드'].includes(refs.payment.value) ? refs.cardName.value.trim() : '', description: refs.description.value.trim(), memo: refs.memo.value.trim(), createdBy: state.currentUser.email, createdAt: new Date().toISOString() }; if (!p.description) { showToast('내용을 입력해주세요.'); refs.description.focus(); return; } if (!p.amount || p.amount <= 0) { showToast('금액은 1원 이상이어야 합니다.'); refs.amount.focus(); return; } if (['현금', '카드', '체크카드'].includes(p.payment) && !p.cardName) { showToast('카드 종류를 입력해주세요.'); refs.cardName.focus(); return; } updateSyncStatus('⏳ 저장 중...'); database.ref(`ledgers/${state.currentUser.uid}/records/${p.id}`).set(p).then(() => { resetForm(); showToast('저장되었습니다.'); updateSyncStatus('✅ 동기화 완료'); }).catch(err => { console.error('저장 실패:', err); showToast('저장에 실패했습니다.'); updateSyncStatus('❌ 동기화 실패'); }); }
    function removeRecord(id) { if (!state.currentUser) return; database.ref(`ledgers/${state.currentUser.uid}/records/${id}`).remove().then(() => { showToast('삭제되었습니다.'); }).catch(err => { console.error('삭제 실패:', err); showToast('삭제에 실패했습니다.'); }); }
    function shareWithEmail(email) { if (!state.currentUser) { showToast('로그인해주세요.'); return; } if (!email || email.trim() === '') { showToast('이메일을 입력해주세요.'); return; } const d = { sharedWith: email, sharedAt: new Date().toISOString() }; updateSyncStatus('⏳ 공유 요청 중...'); database.ref(`ledgers/${state.currentUser.uid}/sharing/${email}`).set(d).then(() => { refs.shareEmail.value = ''; showToast(`${email}에게 공유 요청을 보냈습니다.`); updateSyncStatus('✅ 동기화 완료'); loadSharedWith(); }).catch(err => { console.error('공유 실패:', err); showToast('공유 요청에 실패했습니다.'); updateSyncStatus('❌ 동기화 실패'); }); }
    function loadSharedWith() { if (!state.currentUser) return; database.ref(`ledgers/${state.currentUser.uid}/sharing`).on('value', (snap) => { const d = snap.val() || {}; state.sharedWith = Object.keys(d); if (state.sharedWith.length) { refs.shareList.innerHTML = `<div class="helper-text" style="margin-top: 8px;">👥 공유 중인 계정: ${state.sharedWith.join(', ')}</div>`; } else { refs.shareList.innerHTML = ''; } }); }
    function loadRecords() { if (!state.currentUser) return; updateSyncStatus('⏳ 로딩 중...'); database.ref(`ledgers/${state.currentUser.uid}/records`).on('value', (snap) => { const d = snap.val() || {}; state.records = Object.values(d).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)); render(); updateSyncStatus('✅ 동기화 완료'); }, (err) => { console.error('데이터 로드 실패:', err); updateSyncStatus('❌ 동기화 실패'); }); }
    function logout() { auth.signOut().then(() => { state.currentUser = null; state.records = []; state.sharedWith = []; refs.authModal.classList.remove('hidden'); refs.userInfo.style.display = 'none'; showToast('로그아웃되었습니다.'); }); }
    function signup() { const e = refs.authEmail.value.trim(); const p = refs.authPassword.value.trim(); if (!e || !p) { showToast('이메일과 비밀번호를 입력해주세요.'); return; } if (p.length < 6) { showToast('비밀번호는 6자 이상이어야 합니다.'); return; } updateSyncStatus('⏳ 계정 생성 중...'); refs.signupBtn.disabled = true; refs.loginBtn.disabled = true; auth.createUserWithEmailAndPassword(e, p).then((uc) => { state.currentUser = uc.user; refs.authModal.classList.add('hidden'); refs.userInfo.style.display = 'block'; refs.userName.textContent = `👤 ${e}`; resetForm(); refs.monthFilter.value = getCurrentMonth(); loadRecords(); loadSharedWith(); showToast('계정이 생성되었습니다!'); updateSyncStatus('✅ 동기화 완료'); }).catch((err) => { console.error('회원가입 실패:', err); const errorMap = { 'auth/email-already-in-use': '이미 사용 중인 이메일입니다.', 'auth/invalid-email': '유효하지 않은 이메일 형식입니다.', 'auth/weak-password': '비밀번호가 너무 약합니다 (6자 이상).', 'auth/operation-not-allowed': '❌ Firebase Authentication이 활성화되지 않았습니다. Firebase Console에서 Email/Password 인증을 활성화해주세요.' }; const msg = errorMap[err.code] || err.message; showToast(msg); updateSyncStatus('❌ 동기화 실패'); refs.signupBtn.disabled = false; refs.loginBtn.disabled = false; }); }
    function login() { const e = refs.authEmail.value.trim(); const p = refs.authPassword.value.trim(); if (!e || !p) { showToast('이메일과 비밀번호를 입력해주세요.'); return; } updateSyncStatus('⏳ 로그인 중...'); refs.signupBtn.disabled = true; refs.loginBtn.disabled = true; auth.signInWithEmailAndPassword(e, p).then((uc) => { state.currentUser = uc.user; refs.authModal.classList.add('hidden'); refs.userInfo.style.display = 'block'; refs.userName.textContent = `👤 ${e}`; resetForm(); refs.monthFilter.value = getCurrentMonth(); loadRecords(); loadSharedWith(); showToast('로그인되었습니다!'); updateSyncStatus('✅ 동기화 완료'); }).catch((err) => { console.error('로그인 실패:', err); const errorMap = { 'auth/user-not-found': '등록되지 않은 이메일입니다.', 'auth/wrong-password': '비밀번호가 맞지 않습니다.', 'auth/invalid-email': '유효하지 않은 이메일 형식입니다.', 'auth/user-disabled': '비활성화된 계정입니다.', 'auth/operation-not-allowed': '❌ Firebase Authentication이 활성화되지 않았습니다. Firebase Console에서 Email/Password 인증을 활성화해주세요.' }; const msg = errorMap[err.code] || err.message; showToast(msg); updateSyncStatus('❌ 동기화 실패'); refs.signupBtn.disabled = false; refs.loginBtn.disabled = false; }); }

    refs.loginBtn.addEventListener('click', login);
    refs.signupBtn.addEventListener('click', signup);
    refs.logoutBtn.addEventListener('click', logout);
    document.getElementById('save-btn').addEventListener('click', addRecord);
    document.getElementById('reset-btn').addEventListener('click', resetForm);
    refs.shareBtn.addEventListener('click', () => shareWithEmail(refs.shareEmail.value));
    refs.monthFilter.addEventListener('change', render);
    refs.payment.addEventListener('change', updateCardFieldVisibility);

    window.removeRecord = removeRecord;

    auth.onAuthStateChanged((user) => {
      if (user) {
        state.currentUser = user;
        refs.authModal.classList.add('hidden');
        refs.userInfo.style.display = 'block';
        refs.userName.textContent = `👤 ${user.email}`;
        resetForm();
        refs.monthFilter.value = getCurrentMonth();
        loadRecords();
        loadSharedWith();
      } else {
        refs.authModal.classList.remove('hidden');
      }
    }, (err) => {
      console.error('Firebase 인증 오류:', err);
      updateSyncStatus('❌ Firebase 오류');
    });

    updateSyncStatus('⏳ Firebase 초기화 중...');
  </script>
</body>
</html>
